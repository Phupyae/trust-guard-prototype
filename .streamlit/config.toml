[theme]
base = "light"
primaryColor = "#1C3D82"
backgroundColor = "#F2F5FA"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0E1A33"

[server]
headless = true

[client]
# Pages are linked from the sidebar by ui_theme.page_nav() instead, with readable names.
showSidebarNavigation = false
# Hide Streamlit's own "Deploy" button and developer menu items for the demo.
toolbarMode = "minimal"
